# =============================================================================
# nvme_perf_model 默认配置文件 (nand.conf)
#
# 用法: ./nvme_perf_model
#       ./nvme_perf_model nand.conf
#
# nand-core 分支默认配置：多 channel NAND 后端，无 write cache / bus 层。
#
# 说明:
#   - 以 # 或 // 开头的行，以及行内 # 之后的内容均为注释
#   - key 不区分大小写（tR_fast 与 tr_fast 等价）
#   - 预置 benchmark 见 tests/nand/*.conf
# =============================================================================

# -----------------------------------------------------------------------------
# Channel / CMD 时序 (µs)
# -----------------------------------------------------------------------------

# 非 SCA 模式下，每次 CMD 阶段占用 channel 的时间 (µs)。sca=0 时生效。
cmd_overhead=1.7

# SCA 模式下 CMD 阶段占用 channel 的时间 (µs)。sca=1 时生效。
cmd_overhead_sca=0.7

# 是否启用 SCA 命令时序: 1=使用 cmd_overhead_sca，0=使用 cmd_overhead
sca=1

# Channel 线速 (MB/s)。用于计算每页 DATA 传输时间:
#   data_time = (page_size + parity) * TIME_SCALE / chan_speed
chan_speed=3200

# -----------------------------------------------------------------------------
# 数据单元与线速载荷 (bytes)
# -----------------------------------------------------------------------------

# Host 读命令大小 (bytes)。仅影响读 tR 选取: 4096 用 tr_fast，其它用 tR。
cmd_size=4096

# Host IO 块大小 (bytes)。0 表示 legacy 单页 (4K 读 / 16K 写)。
# 须为 page_size 整数倍，例如 131072 = 8 × 16KiB 页。
block_size=0

# 每页读 DATA 线速上的 ECC 冗余 (bytes)。读线速 = page_size + ecc_parity_size。
ecc_parity_size=600

# NAND 物理页大小 (bytes)。
page_size=16384

# 每页写 DATA 线速上的 parity 冗余 (bytes)。写线速 = page_size + page_parity_size。
page_parity_size=1952

# -----------------------------------------------------------------------------
# NAND 时序 (µs)
# -----------------------------------------------------------------------------

# 4K 读 fast tR (µs)。cmd_size=4096 时使用。别名: tR_fast
tr_fast=40

# 非 4K 读 tR (µs)。cmd_size≠4096 时使用。别名: tR
tR=40

# 有效 program 时间 (µs)。实际 tprog = tprog_eff × nand_type。
# 别名: tprog
tprog_eff=420

# NAND 类型乘子，用于 tprog: 1/3/4 合法。典型 TLC=3。
nand_type=3

# Block erase 时间 (µs)。别名: tERASE (不区分大小写)
tERASE=5000

# -----------------------------------------------------------------------------
# 拓扑与并发
# -----------------------------------------------------------------------------

# Host 队列深度 (in-flight 命令上限)。
qd=1024

# Channel 数量。各 channel 独立 FSM，可并行 CMD/DATA。
chan_num=16

# Die 总数。须能被 chan_num 整除；每 channel die 数 = die_num / chan_num。
die_num=128

# 每个 die 的 plane 数。
plane=4

# 全局 plane slot 上限 (iwl)。当 die_num×plane > iwl_slot 时，
# 每 die 最大并发 plane = iwl_slot / die_num（须为 2 的幂）。
iwl_slot=512

# -----------------------------------------------------------------------------
# 负载比例 (read + write + erase 须 > 0)
# -----------------------------------------------------------------------------

# 读命令权重。
read_ratio=100

# 写命令权重。
write_ratio=0

# 擦除命令权重。
erase_ratio=0

# -----------------------------------------------------------------------------
# IO 模式与条带
# -----------------------------------------------------------------------------

# IO 地址模式: random | sequential (| seq)
# 命令落点: sequential 递增 global die；random 随机 global die
io_pattern=random

# [legacy] stripe_mode 在 l0-base 已移除，配置文件中保留会被忽略

# -----------------------------------------------------------------------------
# Spec 数据单元 (design_spec v1.0 §2；M1 起用，默认不改变 N0 行为)
# -----------------------------------------------------------------------------

# Page Type / Codeword 大小 (bytes)
pt_bytes=65536
cw_bytes=4096

# 0 = N0 page 模型；1 = 启用 spec 单位校验（M2+ 行为开关另配）
use_spec_units=0

# -----------------------------------------------------------------------------
# 仿真控制
# -----------------------------------------------------------------------------

# 仿真结束条件: 累计完成的 host 命令数达到 element 且 inflight=0 时停止。
element=16384
